; Export preset stubs (roadmap R14 item 7). Nothing is exported by the tests or the generator check; these only
; record the intended targets so a port does not start from zero. Signing, icons, package ids and SDK paths are
; left at Godot's defaults on purpose: fill them in on the machine that builds. See docs/dev/notes-controls.md
; (aspect and input notes per target).

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*"
exclude_filter="tests/*, dev/*"
export_path="../build/android/mspsim.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
package/unique_name="com.example.mspsim"
package/name="MSPSim"
screen/immersive_mode=true

[preset.1]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*"
exclude_filter="tests/*, dev/*"
export_path="../build/ios/mspsim.ipa"

[preset.1.options]

application/bundle_identifier="com.example.mspsim"
application/short_version="0.1"
application/version="1"

[preset.2]

name="Linux (Steam Deck)"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*"
exclude_filter="tests/*, dev/*"
export_path="../build/linux/mspsim.x86_64"

[preset.2.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
