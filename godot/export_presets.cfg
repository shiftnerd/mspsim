; Export presets (roadmap R14 item 7, R42). Nothing is exported by the tests or the generator check. Android and iOS
; are stubs that record the intended targets: signing, icons, package ids and SDK paths are left at Godot's defaults
; on purpose, fill them in on the machine that builds. See docs/dev/notes-controls.md (aspect and input notes per
; target). The Linux (Steam Deck) preset is complete: with the 4.7.2 export templates installed,
;   Godot --headless --path godot --export-release "Linux (Steam Deck)"
; writes ../build/linux/mspsim.x86_64 and mspsim.pck (make the build/linux folder first). The Windows preset is the
; fallback build for Proton. See docs/steam-deck.md.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*"
exclude_filter="tests/*, dev/*"
export_path="../build/android/mspsim.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
package/unique_name="com.example.mspsim"
package/name="MSPSim"
screen/immersive_mode=true

[preset.1]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*"
exclude_filter="tests/*, dev/*"
export_path="../build/ios/mspsim.ipa"

[preset.1.options]

application/bundle_identifier="com.example.mspsim"
application/short_version="0.1"
application/version="1"

[preset.2]

name="Linux (Steam Deck)"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*"
exclude_filter="tests/*, dev/*"
export_path="../build/linux/mspsim.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
export DISPLAY=:0
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
pkill -x -f \"{temp_dir}/{exe_name} {cmd_args}\"
rm -rf \"{temp_dir}\""

[preset.3]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*"
exclude_filter="tests/*, dev/*"
export_path="../build/windows/mspsim.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="MSPSim"
application/file_description="MSPSim"
