# The headless test suite, the linter and the generator check, plus a Linux export that is started for a few seconds.
# The repository is public, so standard runners cost nothing: it runs on every push to main, on pull requests, nightly (skipped
# when main did not change in the last 24 hours) and by hand (Actions > tests > Run workflow; the optional "tests" input is a
# space-separated list of test names, e.g. "hiring warehouse", about 3 minutes instead of the full suite's 25 to 30; a
# named-tests run skips the export). A newer run of the same branch cancels an older one still going.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: "Test names to run (space separated). Empty = the whole suite."
        required: false
        default: ""
  schedule:
    - cron: "0 7 * * *"
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.7.2-stable"
jobs:
  gate:
    # the nightly run only goes ahead when main got a commit in the last 24 hours (every other trigger always runs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=1" --jq length)
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
  suite:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import the project
        run: godot --headless --path godot --import
      - name: Lint
        run: |
          pip install gdtoolkit
          cd godot && gdlint scripts tests
      - name: Art lint
        run: |
          pip install pillow
          python tools/art_lint.py --all
      - name: Generator check
        run: python -I tools/check_generator.py --scratch "$RUNNER_TEMP/gen"
      - name: Tests (a failing test is retried once and reported as flaky if it then passes)
        env:
          TESTS: ${{ inputs.tests }}
        run: python tools/run_tests.py --godot /usr/local/bin/godot -j 4 --retry 1 $TESTS
  export:
    # the Linux (Steam Deck) export builds, and the exported game starts, runs 300 frames and exits cleanly
    needs: gate
    if: needs.gate.outputs.run == 'true' && inputs.tests == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Cache the Linux export templates
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-linux-${{ env.GODOT_VERSION }}
      - name: Download the Linux export templates (only on a cache miss: the whole file is 1.2 GB, only the Linux templates are kept)
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}"
          mkdir -p "$dest"
          unzip -j -o templates.tpz 'templates/linux_*.x86_64' 'templates/version.txt' -d "$dest"
          rm templates.tpz
          ls -la "$dest"
      - name: Import the project
        run: godot --headless --path godot --import
      - name: Export Linux (Steam Deck)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          godot --headless --path godot --export-release "Linux (Steam Deck)" "$RUNNER_TEMP/out/mspsim.x86_64"
          ls -la "$RUNNER_TEMP/out"
      - name: Start the exported game for 300 frames
        env:
          MSPSIM_TEST: "1"
        run: |
          cd "$RUNNER_TEMP/out"
          chmod +x mspsim.x86_64
          timeout 120 ./mspsim.x86_64 --headless --quit-after 300 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|ERROR:" run.log; then echo "the exported game logged errors"; exit 1; fi
